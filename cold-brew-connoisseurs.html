<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Cold Brew">
  <meta name="theme-color" content="#100a05">
  <title>Cold Brew Connoisseurs</title>
  <style>
    :root {
      --bg:      #100a05;
      --surface: #1c1208;
      --card:    #271810;
      --border:  #3d2516;
      --accent:  #c8922a;
      --accentlo:rgba(200,146,42,.15);
      --text:    #f0e2cc;
      --text2:   #9a7a5a;
      --text3:   #6a5040;
      --green:   #4caf82;
      --red:     #c0392b;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    html,body { height:100%; overflow:hidden; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }

    /* ── NAME PROMPT ──────────────────────────── */
    #np {
      position:fixed; inset:0; z-index:200; background:var(--bg);
      display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px;
    }
    .np-logo { font-size:68px; filter:drop-shadow(0 0 24px rgba(200,146,42,.45)); margin-bottom:12px; }
    .np-title { font-size:26px; font-weight:800; text-align:center; }
    .np-sub { font-size:14px; color:var(--text2); margin:5px 0 32px; text-align:center; }
    .np-card { width:100%; max-width:360px; background:var(--card); border:1px solid var(--border); border-radius:22px; padding:26px; }
    .np-lbl { display:block; font-size:12px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.6px; margin-bottom:8px; }
    .np-input {
      width:100%; padding:14px 15px; background:var(--surface); border:1.5px solid var(--border);
      border-radius:12px; color:var(--text); font-size:18px; font-family:inherit; outline:none;
      -webkit-appearance:none; transition:border-color .2s; text-align:center; font-weight:600;
    }
    .np-input:focus { border-color:var(--accent); }
    .np-input::placeholder { color:var(--text3); font-weight:400; font-size:16px; }
    .btn-go {
      width:100%; padding:15px; border:none; border-radius:14px; background:var(--accent);
      color:#fff; font-size:17px; font-weight:700; cursor:pointer; font-family:inherit; margin-top:14px;
      transition:opacity .15s,transform .1s;
    }
    .btn-go:active { opacity:.82; transform:scale(.98); }

    /* ── APP SHELL ────────────────────────────── */
    #app { display:none; flex-direction:column; height:100dvh; height:100vh; }
    #app.on { display:flex; }
    .hdr {
      display:flex; align-items:center; justify-content:space-between;
      padding:0 16px; height:52px; flex-shrink:0;
      background:var(--bg); border-bottom:1px solid var(--border);
      padding-top:env(safe-area-inset-top,0);
    }
    .hdr-title { font-size:16px; font-weight:800; letter-spacing:.2px; }
    .name-chip {
      background:var(--accentlo); border:1px solid var(--border); border-radius:20px;
      padding:5px 12px; font-size:13px; font-weight:600; color:var(--accent);
      cursor:pointer; font-family:inherit;
    }
    .pane { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
    .tabbar {
      display:flex; background:var(--surface); border-top:1px solid var(--border);
      padding-bottom:env(safe-area-inset-bottom,0); flex-shrink:0;
    }
    .tab {
      flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:9px 0 5px; border:none; background:transparent; color:var(--text3);
      font-size:10px; font-weight:600; gap:3px; cursor:pointer; font-family:inherit; transition:color .15s;
    }
    .tab .ico { font-size:22px; }
    .tab.on { color:var(--accent); }

    /* ── SHARED ───────────────────────────────── */
    .sec-hd { font-size:12px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.7px; padding:18px 16px 10px; }
    .fg { margin-bottom:14px; }
    .fl { display:block; font-size:12px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.6px; margin-bottom:6px; }
    .fi {
      width:100%; padding:13px 14px; background:var(--surface); border:1.5px solid var(--border);
      border-radius:12px; color:var(--text); font-size:16px; font-family:inherit; outline:none;
      -webkit-appearance:none; transition:border-color .2s;
    }
    .fi:focus { border-color:var(--accent); }
    .fi::placeholder { color:var(--text3); }
    .fi-ta { resize:none; height:90px; line-height:1.5; }
    .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .empty { text-align:center; padding:50px 20px; color:var(--text3); }
    .empty .eico { font-size:44px; margin-bottom:10px; }
    .empty .etxt { font-size:15px; color:var(--text2); }
    .empty .esub { font-size:13px; margin-top:6px; }
    .btn-primary {
      width:100%; padding:15px; border:none; border-radius:14px; background:var(--accent);
      color:#fff; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit;
      transition:opacity .15s,transform .1s; margin-top:4px;
    }
    .btn-primary:active { opacity:.82; transform:scale(.98); }
    .btn-primary:disabled { opacity:.45; }

    /* ── TOP PICKS ────────────────────────────── */
    .top-picks { padding:0 16px 4px; display:flex; gap:10px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    .top-picks::-webkit-scrollbar { display:none; }
    .pick-card {
      flex-shrink:0; width:140px; background:var(--card); border:1px solid var(--border);
      border-radius:16px; padding:14px 12px 12px; cursor:pointer; transition:background .1s;
      display:flex; flex-direction:column; gap:4px;
    }
    .pick-card:active { background:var(--surface); }
    .pick-medal { font-size:22px; margin-bottom:4px; }
    .pick-score { font-size:36px; font-weight:900; line-height:1; }
    .pick-name { font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:4px; }
    .pick-loc { font-size:11px; color:var(--text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pick-cnt { font-size:11px; color:var(--text3); margin-top:2px; }

    /* ── RANKINGS LIST ────────────────────────── */
    .brew-row {
      display:flex; align-items:center; gap:12px;
      padding:12px 16px; border-bottom:1px solid var(--border);
      cursor:pointer; transition:background .1s;
    }
    .brew-row:active { background:var(--card); }
    .rank-num { font-size:16px; font-weight:800; color:var(--text3); min-width:28px; text-align:center; }
    .brew-info { flex:1; min-width:0; }
    .brew-name { font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .brew-loc { font-size:12px; color:var(--text2); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .brew-meta { font-size:11px; color:var(--text3); margin-top:3px; }
    .score-badge { font-size:20px; font-weight:900; flex-shrink:0; }

    /* ── ADD FORM ─────────────────────────────── */
    .add-wrap { padding:16px 16px 50px; }
    .score-val { text-align:center; font-size:58px; font-weight:900; line-height:1; margin:6px 0 2px; }
    .slider {
      width:100%; -webkit-appearance:none; height:6px; border-radius:3px;
      background:var(--border); outline:none; margin:6px 0;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance:none; width:30px; height:30px; border-radius:50%;
      background:var(--accent); cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.5);
    }
    .slider-lbl { display:flex; justify-content:space-between; font-size:11px; color:var(--text3); }

    /* ── CONFERENCES ──────────────────────────── */
    .conf-header { padding:16px 16px 0; display:flex; align-items:center; justify-content:space-between; }
    .conf-header h2 { font-size:18px; font-weight:800; }
    .btn-nominate {
      padding:8px 14px; background:var(--accent); border:none; border-radius:20px;
      color:#fff; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;
    }
    .conf-card {
      margin:10px 16px; background:var(--card); border:1px solid var(--border);
      border-radius:16px; padding:14px 16px;
    }
    .conf-card.visited { opacity:.55; }
    .conf-name { font-size:17px; font-weight:800; }
    .conf-loc { font-size:13px; color:var(--text2); margin-top:2px; }
    .conf-notes { font-size:14px; color:var(--text2); margin-top:8px; line-height:1.4; }
    .conf-by { font-size:12px; color:var(--text3); margin-top:8px; }
    .conf-actions { margin-top:10px; }
    .btn-visited {
      width:100%; padding:10px; border:1px solid var(--border); border-radius:10px;
      background:transparent; color:var(--text2); font-size:13px; font-weight:600;
      cursor:pointer; font-family:inherit; transition:all .15s;
    }
    .btn-visited:active { background:var(--surface); }

    /* ── DETAIL MODAL ─────────────────────────── */
    .overlay {
      position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:100;
      display:flex; flex-direction:column; justify-content:flex-end;
      animation:fadein .2s ease;
    }
    .sheet {
      background:var(--surface); border-radius:24px 24px 0 0;
      max-height:88dvh; overflow-y:auto; -webkit-overflow-scrolling:touch;
      padding-bottom:env(safe-area-inset-bottom,24px);
      animation:slideup .28s ease;
    }
    .handle { width:38px; height:4px; background:var(--text3); border-radius:2px; margin:12px auto 0; }
    .det-top { padding:12px 16px 18px; border-bottom:1px solid var(--border); }
    .det-name { font-size:22px; font-weight:800; }
    .det-loc { font-size:14px; color:var(--text2); margin:3px 0 12px; }
    .det-avg { font-size:52px; font-weight:900; line-height:1; }
    .det-cnt { font-size:13px; color:var(--text3); margin-left:10px; }
    .rater-row { display:flex; gap:12px; padding:13px 16px; border-bottom:1px solid var(--border); }
    .mini-av {
      width:36px; height:36px; border-radius:50%; flex-shrink:0; background:var(--card);
      display:flex; align-items:center; justify-content:center;
      font-size:14px; font-weight:700; color:var(--accent);
    }
    .rater-info { flex:1; }
    .rater-top { display:flex; justify-content:space-between; align-items:center; }
    .rater-name { font-size:15px; font-weight:700; }
    .rater-score { font-size:20px; font-weight:900; flex-shrink:0; }
    .rater-notes { font-size:13px; color:var(--text2); margin-top:3px; line-height:1.4; }
    .rater-meta { display:flex; justify-content:space-between; align-items:center; margin-top:4px; }
    .rater-date { font-size:11px; color:var(--text3); }
    .del-btn { background:transparent; border:none; color:var(--text3); font-size:16px; cursor:pointer; padding:2px 4px; }
    .del-btn:active { color:var(--red); }

    /* ── NOMINATE MODAL ───────────────────────── */
    .nom-sheet { padding:4px 16px 40px; }
    .nom-title { font-size:20px; font-weight:800; padding:8px 0 18px; }

    /* ── TOAST ────────────────────────────────── */
    .toast {
      position:fixed; bottom:calc(68px + env(safe-area-inset-bottom,0px) + 12px);
      left:50%; transform:translateX(-50%);
      background:rgba(28,18,8,.96); border:1px solid var(--border);
      color:var(--text); padding:9px 18px; border-radius:20px;
      font-size:14px; font-weight:600; z-index:300; white-space:nowrap;
      backdrop-filter:blur(10px); animation:toastin .25s ease;
    }

    @keyframes fadein  { from{opacity:0} to{opacity:1} }
    @keyframes slideup { from{transform:translateY(100%)} to{transform:translateY(0)} }
    @keyframes toastin { from{opacity:0;transform:translateX(-50%) translateY(8px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
  </style>
</head>
<body>

<!-- Name Prompt -->
<div id="np">
  <div class="np-logo">☕</div>
  <div class="np-title">Cold Brew Connoisseurs</div>
  <div class="np-sub">Rate. Rank. Repeat.</div>
  <div class="np-card">
    <label class="np-lbl">What should we call you?</label>
    <input type="text" id="np-in" class="np-input" placeholder="Your name" autocomplete="given-name" maxlength="30">
    <button class="btn-go" onclick="saveName()">Let's Go ☕</button>
  </div>
</div>

<!-- App -->
<div id="app">
  <div class="hdr">
    <div class="hdr-title">☕ Cold Brew Connoisseurs</div>
    <button class="name-chip" id="name-chip" onclick="editName()"></button>
  </div>
  <div class="pane" id="pane"></div>
  <nav class="tabbar">
    <button class="tab on" id="t-rankings"   onclick="go('rankings')"><span class="ico">🏆</span>Rankings</button>
    <button class="tab"    id="t-add"         onclick="go('add')"><span class="ico">➕</span>Add</button>
    <button class="tab"    id="t-conferences" onclick="go('conferences')"><span class="ico">📍</span>Conferences</button>
  </nav>
</div>

<script type="module">
// ── Firebase Config ───────────────────────────────────
const firebaseConfig = {
  apiKey:            "AIzaSyD8H1a7muv0fA63opIn7mOFM4EpHp9jrRM",
  authDomain:        "cold-brew-connoisseurs.firebaseapp.com",
  projectId:         "cold-brew-connoisseurs",
  storageBucket:     "cold-brew-connoisseurs.firebasestorage.app",
  messagingSenderId: "426043876928",
  appId:             "1:426043876928:web:ad6b8aba407136f353a1a5"
};
// ─────────────────────────────────────────────────────

const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js');
const { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, deleteDoc, updateDoc } =
  await import('https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js');

const fapp = initializeApp(firebaseConfig);
const db   = getFirestore(fapp);

// ── State ─────────────────────────────────────────────
let myName      = localStorage.getItem('cbc_name') || '';
let tab         = 'rankings';
let ratings     = [];
let conferences = [];

// ── Boot ──────────────────────────────────────────────
if (!myName) {
  document.getElementById('np').style.display = 'flex';
} else {
  startApp();
}

// ── Name handling ─────────────────────────────────────
window.saveName = () => {
  const n = document.getElementById('np-in').value.trim();
  if (!n) return;
  localStorage.setItem('cbc_name', n);
  myName = n;
  document.getElementById('np').style.display = 'none';
  startApp();
};

document.getElementById('np-in').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveName();
});

window.editName = () => {
  const n = prompt('Change your name:', myName);
  if (n && n.trim()) {
    myName = n.trim();
    localStorage.setItem('cbc_name', myName);
    document.getElementById('name-chip').textContent = myName + ' ✏️';
  }
};

// ── Start app ─────────────────────────────────────────
function startApp() {
  document.getElementById('app').classList.add('on');
  document.getElementById('name-chip').textContent = myName + ' ✏️';

  const qr = query(collection(db, 'ratings'), orderBy('createdAt', 'desc'));
  onSnapshot(qr, snap => {
    ratings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });

  const qc = query(collection(db, 'conferences'), orderBy('nominatedAt', 'desc'));
  onSnapshot(qc, snap => {
    conferences = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (tab === 'conferences') render();
  });

  go('rankings');
}

// ── Tab nav ───────────────────────────────────────────
window.go = t => {
  tab = t;
  ['rankings', 'add', 'conferences'].forEach(x => {
    document.getElementById(`t-${x}`).classList.toggle('on', x === t);
  });
  render();
};

function render() {
  if (tab === 'rankings')    renderRankings();
  else if (tab === 'add')    renderAdd();
  else                       renderConferences();
}

// ── Utils ─────────────────────────────────────────────
const scoreColor = s => s >= 8 ? 'var(--green)' : s >= 6 ? 'var(--accent)' : 'var(--red)';
const initials   = n => n ? n.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2) : '?';
const fmtLoc     = r => [r.city, r.state, r.country].filter(Boolean).join(', ');
const brewKey    = r => (r.storeName || '').toLowerCase().trim() + '|' + (r.city || '').toLowerCase().trim();
const timeAgo    = ts => {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const s = Math.floor((Date.now() - d) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 604800) return Math.floor(s / 86400) + 'd ago';
  return d.toLocaleDateString();
};

window.toast = msg => {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2400);
};

function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function groupByBrew(rs) {
  const map = {};
  for (const r of rs) {
    const k = brewKey(r);
    if (!map[k]) map[k] = { storeName: r.storeName, city: r.city, state: r.state, country: r.country, ratings: [] };
    map[k].ratings.push(r);
  }
  return Object.values(map).map(b => ({
    ...b,
    avg: b.ratings.reduce((s, r) => s + r.score, 0) / b.ratings.length,
    cnt: b.ratings.length,
  })).sort((a, b) => b.avg - a.avg);
}

// ── Rankings ──────────────────────────────────────────
function renderRankings() {
  const brews  = groupByBrew(ratings);
  const medals = ['🥇', '🥈', '🥉'];
  const top3   = brews.slice(0, 3);
  const rest   = brews.slice(3);
  const pane   = document.getElementById('pane');

  if (!brews.length) {
    pane.innerHTML = `<div class="empty"><div class="eico">☕</div><div class="etxt">No cold brews ranked yet</div><div class="esub">Be the first to add one!</div></div>`;
    return;
  }

  pane.innerHTML = `
    ${top3.length ? `
      <div class="sec-hd">⭐ Top Picks</div>
      <div class="top-picks">
        ${top3.map((b, i) => `
          <div class="pick-card" data-idx="${i}">
            <div class="pick-medal">${medals[i]}</div>
            <div class="pick-score" style="color:${scoreColor(b.avg)}">${b.avg.toFixed(1)}</div>
            <div class="pick-name">${esc(b.storeName)}</div>
            <div class="pick-loc">${esc(fmtLoc(b))}</div>
            <div class="pick-cnt">${b.cnt} rating${b.cnt !== 1 ? 's' : ''}</div>
          </div>
        `).join('')}
      </div>
    ` : ''}
    ${rest.length ? `
      <div class="sec-hd">All ${brews.length} Brews Ranked</div>
      ${rest.map((b, i) => `
        <div class="brew-row" data-idx="${i + 3}">
          <div class="rank-num">#${i + 4}</div>
          <div class="brew-info">
            <div class="brew-name">${esc(b.storeName)}</div>
            <div class="brew-loc">${esc(fmtLoc(b))}</div>
            <div class="brew-meta">${b.cnt} rating${b.cnt !== 1 ? 's' : ''}</div>
          </div>
          <div class="score-badge" style="color:${scoreColor(b.avg)}">${b.avg.toFixed(1)}</div>
        </div>
      `).join('')}
    ` : ''}
    <div style="height:20px"></div>
  `;

  pane.querySelectorAll('.pick-card, .brew-row').forEach(el => {
    el.addEventListener('click', () => openDetail(+el.dataset.idx));
  });
}

function openDetail(idx) {
  const brew = groupByBrew(ratings)[idx];
  if (!brew) return;
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <div class="sheet">
      <div class="handle"></div>
      <div class="det-top">
        <div class="det-name">${esc(brew.storeName)}</div>
        <div class="det-loc">${esc(fmtLoc(brew))}</div>
        <div style="display:flex;align-items:baseline">
          <div class="det-avg" style="color:${scoreColor(brew.avg)}">${brew.avg.toFixed(1)}</div>
          <div class="det-cnt">avg &middot; ${brew.cnt} rating${brew.cnt !== 1 ? 's' : ''}</div>
        </div>
      </div>
      <div class="sec-hd">All Ratings</div>
      ${brew.ratings.map(r => `
        <div class="rater-row">
          <div class="mini-av">${initials(r.raterName)}</div>
          <div class="rater-info">
            <div class="rater-top">
              <div class="rater-name">${esc(r.raterName)}</div>
              <div class="rater-score" style="color:${scoreColor(r.score)}">${r.score.toFixed(1)}</div>
            </div>
            ${r.notes ? `<div class="rater-notes">${esc(r.notes)}</div>` : ''}
            <div class="rater-meta">
              <div class="rater-date">${timeAgo(r.createdAt)}</div>
              ${r.raterName === myName ? `<button class="del-btn" data-id="${r.id}">🗑</button>` : ''}
            </div>
          </div>
        </div>
      `).join('')}
      <div style="height:20px"></div>
    </div>
  `;
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  ov.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Delete your rating?')) return;
      await deleteDoc(doc(db, 'ratings', btn.dataset.id));
      ov.remove();
      toast('Deleted');
    });
  });
  document.body.appendChild(ov);
}

// ── Add form ──────────────────────────────────────────
function renderAdd() {
  const stores = [...new Set(ratings.map(r => r.storeName))].sort();
  document.getElementById('pane').innerHTML = `
    <div class="add-wrap">
      <datalist id="dl">${stores.map(s => `<option value="${esc(s)}">`).join('')}</datalist>
      <div class="fg">
        <label class="fl">Store Name *</label>
        <input type="text" id="f-store" class="fi" placeholder="e.g. Blue Bottle Coffee" list="dl" autocomplete="off">
      </div>
      <div class="row2">
        <div class="fg">
          <label class="fl">City</label>
          <input type="text" id="f-city" class="fi" placeholder="New York">
        </div>
        <div class="fg">
          <label class="fl">State</label>
          <input type="text" id="f-state" class="fi" placeholder="NY">
        </div>
      </div>
      <div class="fg">
        <label class="fl">Country</label>
        <input type="text" id="f-country" class="fi" placeholder="USA">
      </div>
      <div class="fg">
        <label class="fl">Your Score</label>
        <div class="score-val" id="sv" style="color:${scoreColor(7.5)}">7.5</div>
        <input type="range" id="f-score" class="slider" min="1" max="10" step="0.1" value="7.5">
        <div class="slider-lbl"><span>1 — Bad</span><span>5.5</span><span>10 — 🔥</span></div>
      </div>
      <div class="fg">
        <label class="fl">Tasting Notes</label>
        <textarea id="f-notes" class="fi fi-ta" placeholder="Smooth, strong, sweet, chocolatey…"></textarea>
      </div>
      <button class="btn-primary" id="sub-btn" onclick="submitRating()">Submit Rating</button>
    </div>
  `;
  document.getElementById('f-score').addEventListener('input', function () {
    const v = parseFloat(this.value);
    const el = document.getElementById('sv');
    el.textContent = v.toFixed(1);
    el.style.color = scoreColor(v);
  });
}

window.submitRating = async () => {
  const store = document.getElementById('f-store').value.trim();
  if (!store) { toast('Store name is required'); return; }
  const btn = document.getElementById('sub-btn');
  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    await addDoc(collection(db, 'ratings'), {
      raterName: myName,
      storeName: store,
      city:      document.getElementById('f-city').value.trim(),
      state:     document.getElementById('f-state').value.trim(),
      country:   document.getElementById('f-country').value.trim(),
      score:     parseFloat(document.getElementById('f-score').value),
      notes:     document.getElementById('f-notes').value.trim(),
      createdAt: serverTimestamp(),
    });
    toast('Rating submitted! ☕');
    go('rankings');
  } catch (e) {
    toast('Error: ' + e.message);
    btn.disabled = false; btn.textContent = 'Submit Rating';
  }
};

// ── Conferences ───────────────────────────────────────
function renderConferences() {
  const upcoming = conferences.filter(c => !c.visited);
  const visited  = conferences.filter(c => c.visited);
  const pane     = document.getElementById('pane');

  pane.innerHTML = `
    <div class="conf-header">
      <h2>📍 Conferences</h2>
      <button class="btn-nominate" onclick="openNominate()">+ Nominate</button>
    </div>
    <div style="padding:6px 16px 0;font-size:13px;color:var(--text3)">Places the crew needs to visit together</div>

    ${upcoming.length ? `
      <div class="sec-hd">Planning (${upcoming.length})</div>
      ${upcoming.map(c => `
        <div class="conf-card">
          <div class="conf-name">${esc(c.shopName)}</div>
          <div class="conf-loc">${esc([c.city, c.state, c.country].filter(Boolean).join(', '))}</div>
          ${c.notes ? `<div class="conf-notes">${esc(c.notes)}</div>` : ''}
          <div class="conf-by">Nominated by ${esc(c.nominatedBy)} &middot; ${timeAgo(c.nominatedAt)}</div>
          <div class="conf-actions">
            <button class="btn-visited" data-id="${c.id}">✅ Mark as Visited</button>
          </div>
        </div>
      `).join('')}
    ` : `
      <div class="empty" style="padding:30px 20px 10px">
        <div class="eico">📍</div>
        <div class="etxt">No conferences planned yet</div>
        <div class="esub">Nominate a spot for the crew!</div>
      </div>
    `}

    ${visited.length ? `
      <div class="sec-hd">Been There ✅ (${visited.length})</div>
      ${visited.map(c => `
        <div class="conf-card visited">
          <div class="conf-name">${esc(c.shopName)}</div>
          <div class="conf-loc">${esc([c.city, c.state, c.country].filter(Boolean).join(', '))}</div>
          <div class="conf-by">Nominated by ${esc(c.nominatedBy)}</div>
        </div>
      `).join('')}
    ` : ''}
    <div style="height:30px"></div>
  `;

  pane.querySelectorAll('.btn-visited').forEach(btn => {
    btn.addEventListener('click', async () => {
      await updateDoc(doc(db, 'conferences', btn.dataset.id), { visited: true, visitedAt: serverTimestamp() });
      toast('Marked as visited! ☕');
    });
  });
}

window.openNominate = () => {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.id = 'nom-ov';
  ov.innerHTML = `
    <div class="sheet">
      <div class="handle"></div>
      <div class="nom-sheet">
        <div class="nom-title">📍 Nominate a Conference Spot</div>
        <div class="fg">
          <label class="fl">Coffee Shop Name *</label>
          <input type="text" id="n-shop" class="fi" placeholder="e.g. Verve Coffee Roasters">
        </div>
        <div class="row2">
          <div class="fg">
            <label class="fl">City</label>
            <input type="text" id="n-city" class="fi" placeholder="San Francisco">
          </div>
          <div class="fg">
            <label class="fl">State</label>
            <input type="text" id="n-state" class="fi" placeholder="CA">
          </div>
        </div>
        <div class="fg">
          <label class="fl">Country</label>
          <input type="text" id="n-country" class="fi" placeholder="USA">
        </div>
        <div class="fg">
          <label class="fl">Why this spot?</label>
          <textarea id="n-notes" class="fi fi-ta" placeholder="Heard great things, someone recommended it…"></textarea>
        </div>
        <button class="btn-primary" id="nom-btn" onclick="submitNomination()">Nominate Spot</button>
      </div>
    </div>
  `;
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  document.body.appendChild(ov);
};

window.submitNomination = async () => {
  const shop = document.getElementById('n-shop').value.trim();
  if (!shop) { toast('Shop name is required'); return; }
  const btn = document.getElementById('nom-btn');
  btn.disabled = true; btn.textContent = 'Nominating…';
  try {
    await addDoc(collection(db, 'conferences'), {
      shopName:    shop,
      city:        document.getElementById('n-city').value.trim(),
      state:       document.getElementById('n-state').value.trim(),
      country:     document.getElementById('n-country').value.trim(),
      notes:       document.getElementById('n-notes').value.trim(),
      nominatedBy: myName,
      nominatedAt: serverTimestamp(),
      visited:     false,
    });
    document.getElementById('nom-ov')?.remove();
    toast('Conference nominated! 📍');
  } catch (e) {
    toast('Error: ' + e.message);
    btn.disabled = false; btn.textContent = 'Nominate Spot';
  }
};
</script>
</body>

<!--
================================================================================
  COLD BREW CONNOISSEURS — Setup Instructions
================================================================================

  1. Go to https://console.firebase.google.com → Create a new project

  2. Enable these Firebase services:
     • Authentication → Sign-in method → Email/Password → Enable
     • Firestore Database → Create database → Start in test mode
     • Storage → Get started

  3. Go to Project Settings (⚙️) → Your apps → Add app → Web (</>)
     Copy the firebaseConfig object and paste it into the script below
     (replace everything inside the { } of the firebaseConfig variable)

  4. Set Firestore Security Rules (Firestore → Rules tab):

       rules_version = '2';
       service cloud.firestore {
         match /databases/{database}/documents {
           match /ratings/{ratingId} {
             allow read: if request.auth != null;
             allow create: if request.auth != null
               && request.resource.data.userId == request.auth.uid;
             allow delete: if request.auth != null
               && resource.data.userId == request.auth.uid;
           }
         }
       }

  5. Set Storage Security Rules (Storage → Rules tab):

       rules_version = '2';
       service firebase.storage {
         match /b/{bucket}/o {
           match /ratings/{userId}/{allPaths=**} {
             allow read: if request.auth != null;
             allow write: if request.auth != null && request.auth.uid == userId;
           }
         }
       }

  6. Host or share:
     • Easiest: upload to GitHub Pages or Netlify (both free)
     • iPhone tip: open in Safari → Share → "Add to Home Screen" for app feel

================================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Cold Brew">
  <meta name="theme-color" content="#100a05">
  <title>Cold Brew Connoisseurs</title>
  <style>
    :root {
      --bg:       #100a05;
      --surface:  #1c1208;
      --card:     #271810;
      --border:   #3d2516;
      --accent:   #c8922a;
      --accentlo: rgba(200,146,42,0.18);
      --text:     #f0e2cc;
      --text2:    #9a7a5a;
      --text3:    #6a5040;
      --green:    #4caf82;
      --amber:    #c8922a;
      --red:      #c0392b;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    html,body { height:100%; overflow:hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* ── AUTH ─────────────────────────────────────────── */
    #auth {
      position:fixed; inset:0; z-index:100;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      padding:24px; background:var(--bg);
    }
    .auth-logo { font-size:64px; filter:drop-shadow(0 0 24px rgba(200,146,42,.4)); margin-bottom:10px; }
    .auth-title { font-size:24px; font-weight:800; text-align:center; }
    .auth-sub { font-size:14px; color:var(--text2); margin:4px 0 32px; text-align:center; }
    .auth-card {
      width:100%; max-width:380px;
      background:var(--card); border:1px solid var(--border);
      border-radius:22px; padding:26px;
    }
    .seg { display:flex; background:var(--surface); border-radius:10px; padding:4px; margin-bottom:22px; }
    .seg-btn {
      flex:1; padding:8px; border:none; border-radius:8px;
      background:transparent; color:var(--text2);
      font-size:14px; font-weight:600; cursor:pointer; font-family:inherit;
      transition:all .2s;
    }
    .seg-btn.on { background:var(--accent); color:#fff; }
    .fg { margin-bottom:14px; }
    .fl { display:block; font-size:12px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.6px; margin-bottom:6px; }
    .fi {
      width:100%; padding:13px 15px; background:var(--surface);
      border:1.5px solid var(--border); border-radius:12px;
      color:var(--text); font-size:16px; font-family:inherit; outline:none;
      -webkit-appearance:none; transition:border-color .2s;
    }
    .fi:focus { border-color:var(--accent); }
    .fi::placeholder { color:var(--text3); }
    .fi-ta { resize:none; height:96px; line-height:1.5; }
    .btn {
      width:100%; padding:14px; border:none; border-radius:14px;
      background:var(--accent); color:#fff; font-size:16px; font-weight:700;
      cursor:pointer; font-family:inherit; margin-top:6px;
      transition:opacity .15s, transform .1s;
    }
    .btn:active { opacity:.82; transform:scale(.98); }
    .btn:disabled { opacity:.45; }
    .btn-ghost {
      background:transparent; border:1.5px solid var(--border);
      color:var(--text2); font-weight:600; margin-top:0;
    }
    .auth-err { color:#e74c3c; font-size:13px; text-align:center; margin-top:10px; min-height:18px; }

    /* ── APP SHELL ────────────────────────────────────── */
    #app { display:none; flex-direction:column; height:100dvh; height:100vh; }
    #app.on { display:flex; }
    .hdr {
      display:flex; align-items:center; justify-content:space-between;
      padding:0 18px; height:54px; flex-shrink:0;
      background:var(--bg); border-bottom:1px solid var(--border);
      padding-top:env(safe-area-inset-top,0);
    }
    .hdr-title { font-size:17px; font-weight:700; }
    .pane { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
    .tabbar {
      display:flex; background:var(--surface);
      border-top:1px solid var(--border);
      padding-bottom:env(safe-area-inset-bottom,0); flex-shrink:0;
    }
    .tab {
      flex:1; display:flex; flex-direction:column; align-items:center;
      justify-content:center; padding:9px 0 5px; border:none;
      background:transparent; color:var(--text3); font-size:10px;
      font-weight:600; gap:3px; cursor:pointer; font-family:inherit;
      transition:color .15s;
    }
    .tab .ico { font-size:22px; }
    .tab.on { color:var(--accent); }

    /* ── SHARED ───────────────────────────────────────── */
    .sec-hd {
      font-size:12px; font-weight:700; color:var(--text2);
      text-transform:uppercase; letter-spacing:.7px;
      padding:18px 18px 8px;
    }
    .empty { text-align:center; padding:60px 20px; color:var(--text3); }
    .empty .eico { font-size:48px; margin-bottom:10px; }
    .empty .etxt { font-size:15px; color:var(--text2); }
    .empty .esub { font-size:13px; margin-top:6px; }

    /* ── RANKINGS ─────────────────────────────────────── */
    .brew-row {
      display:flex; align-items:center; gap:13px;
      padding:13px 18px; border-bottom:1px solid var(--border);
      cursor:pointer; transition:background .1s;
    }
    .brew-row:active { background:var(--card); }
    .rank-num { font-size:18px; font-weight:800; color:var(--text3); min-width:26px; text-align:center; }
    .rank-medal { font-size:22px; min-width:26px; text-align:center; }
    .brew-thumb {
      width:54px; height:54px; border-radius:11px; flex-shrink:0;
      background:var(--card); display:flex; align-items:center;
      justify-content:center; font-size:24px; overflow:hidden;
    }
    .brew-thumb img { width:100%; height:100%; object-fit:cover; }
    .brew-info { flex:1; min-width:0; }
    .brew-name { font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .brew-loc { font-size:13px; color:var(--text2); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .brew-meta { font-size:12px; color:var(--text3); margin-top:3px; }
    .score-big { font-size:22px; font-weight:900; flex-shrink:0; }

    /* ── ADD FORM ─────────────────────────────────────── */
    .add-wrap { padding:16px 18px 50px; }
    .add-title { font-size:22px; font-weight:800; margin-bottom:22px; }
    .score-val { text-align:center; font-size:56px; font-weight:900; line-height:1; margin:8px 0 4px; }
    .slider {
      width:100%; -webkit-appearance:none; height:6px;
      border-radius:3px; background:var(--border); outline:none; margin:6px 0;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance:none; width:30px; height:30px;
      border-radius:50%; background:var(--accent); cursor:pointer;
      box-shadow:0 2px 8px rgba(0,0,0,.5);
    }
    .slider-lbl { display:flex; justify-content:space-between; font-size:11px; color:var(--text3); }
    .photo-zone {
      width:100%; padding:18px; background:var(--surface);
      border:2px dashed var(--border); border-radius:14px;
      color:var(--text2); font-size:14px; text-align:center;
      cursor:pointer; font-family:inherit; transition:border-color .2s;
    }
    .photo-zone.filled { border-color:var(--accent); color:var(--accent); }
    .photo-prev { width:100%; max-height:200px; object-fit:cover; border-radius:12px; margin-top:10px; display:none; }
    .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

    /* ── PROFILE ──────────────────────────────────────── */
    .prof-hd { display:flex; flex-direction:column; align-items:center; padding:30px 18px 22px; border-bottom:1px solid var(--border); }
    .avatar {
      width:70px; height:70px; border-radius:50%;
      background:var(--accent); display:flex; align-items:center;
      justify-content:center; font-size:28px; font-weight:800;
      color:#fff; margin-bottom:12px;
    }
    .prof-name { font-size:22px; font-weight:700; }
    .prof-email { font-size:13px; color:var(--text2); margin-top:2px; }
    .stats { display:flex; gap:1px; background:var(--border); border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
    .stat { flex:1; text-align:center; padding:14px 4px; background:var(--bg); }
    .stat-val { font-size:24px; font-weight:900; color:var(--accent); }
    .stat-lbl { font-size:10px; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; margin-top:2px; }
    .my-row { padding:14px 18px; border-bottom:1px solid var(--border); }
    .my-row-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:2px; }
    .my-store { font-size:16px; font-weight:700; }
    .my-loc { font-size:13px; color:var(--text2); }
    .my-notes { font-size:14px; color:var(--text2); margin-top:6px; line-height:1.4; }
    .my-date { font-size:12px; color:var(--text3); margin-top:4px; }
    .my-img { width:100%; max-height:160px; object-fit:cover; border-radius:10px; margin-top:8px; }
    .del-btn {
      background:transparent; border:none; color:var(--text3);
      font-size:20px; cursor:pointer; padding:4px 6px; line-height:1;
    }
    .del-btn:active { color:#e74c3c; }

    /* ── DETAIL MODAL ─────────────────────────────────── */
    .overlay {
      position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:200;
      display:flex; flex-direction:column; justify-content:flex-end;
      animation:fadein .2s ease;
    }
    .sheet {
      background:var(--surface); border-radius:24px 24px 0 0;
      max-height:88dvh; overflow-y:auto; -webkit-overflow-scrolling:touch;
      padding-bottom:env(safe-area-inset-bottom,24px);
      animation:slideup .28s ease;
    }
    .handle { width:38px; height:4px; background:var(--text3); border-radius:2px; margin:12px auto 0; }
    .det-top { padding:12px 18px 20px; border-bottom:1px solid var(--border); }
    .det-cover { width:100%; max-height:220px; object-fit:cover; }
    .det-name { font-size:22px; font-weight:800; }
    .det-loc { font-size:14px; color:var(--text2); margin:3px 0 12px; }
    .det-avg { font-size:50px; font-weight:900; line-height:1; }
    .det-cnt { font-size:14px; color:var(--text3); margin-left:10px; }
    .rater-row { display:flex; gap:12px; padding:14px 18px; border-bottom:1px solid var(--border); }
    .mini-av {
      width:38px; height:38px; border-radius:50%; flex-shrink:0;
      background:var(--card); display:flex; align-items:center;
      justify-content:center; font-size:15px; font-weight:700; color:var(--accent);
    }
    .rater-info { flex:1; }
    .rater-name { font-size:15px; font-weight:700; }
    .rater-notes { font-size:13px; color:var(--text2); margin-top:3px; line-height:1.4; }
    .rater-date { font-size:12px; color:var(--text3); margin-top:3px; }
    .rater-img { width:100%; max-height:140px; object-fit:cover; border-radius:10px; margin-top:8px; }
    .rater-score { font-size:20px; font-weight:900; flex-shrink:0; }

    /* ── TOAST ────────────────────────────────────────── */
    .toast {
      position:fixed; bottom:calc(72px + env(safe-area-inset-bottom,0px) + 12px);
      left:50%; transform:translateX(-50%);
      background:rgba(28,18,8,.96); border:1px solid var(--border);
      color:var(--text); padding:9px 18px; border-radius:20px;
      font-size:14px; font-weight:600; z-index:300; white-space:nowrap;
      backdrop-filter:blur(10px); animation:toastin .25s ease;
    }
    @keyframes fadein  { from{opacity:0}  to{opacity:1} }
    @keyframes slideup { from{transform:translateY(100%)} to{transform:translateY(0)} }
    @keyframes toastin { from{opacity:0;transform:translateX(-50%) translateY(8px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
    .spinner-wrap { text-align:center; padding:40px; }
    .spin {
      display:inline-block; width:24px; height:24px;
      border:3px solid var(--border); border-top-color:var(--accent);
      border-radius:50%; animation:rotate .8s linear infinite;
    }
    @keyframes rotate { to{transform:rotate(360deg)} }

    /* ── SETUP BANNER ─────────────────────────────────── */
    #setup-banner {
      position:fixed; inset:0; z-index:999;
      background:var(--bg); display:flex; flex-direction:column;
      align-items:center; justify-content:center; padding:32px; text-align:center;
    }
    #setup-banner h2 { font-size:22px; font-weight:800; margin:16px 0 10px; }
    #setup-banner p { color:var(--text2); line-height:1.6; font-size:15px; max-width:320px; }
  </style>
</head>
<body>

<!-- Setup banner shown if Firebase config not filled in -->
<div id="setup-banner" style="display:none">
  <div style="font-size:56px">☕</div>
  <h2>Firebase Setup Required</h2>
  <p>Open this HTML file in a text editor and paste your Firebase config object into the <code>firebaseConfig</code> variable near the top of the &lt;script&gt; tag. See the instructions at the top of the file.</p>
</div>

<!-- Auth -->
<div id="auth">
  <div class="auth-logo">☕</div>
  <div class="auth-title">Cold Brew Connoisseurs</div>
  <div class="auth-sub">Rate. Rank. Repeat.</div>
  <div class="auth-card">
    <div class="seg">
      <button class="seg-btn on" id="tab-login"    onclick="setMode('login')">Log In</button>
      <button class="seg-btn"    id="tab-register" onclick="setMode('register')">Sign Up</button>
    </div>
    <div class="fg" id="fg-name" style="display:none">
      <label class="fl">Your Name</label>
      <input type="text" id="a-name" class="fi" placeholder="e.g. Ryan" autocomplete="name">
    </div>
    <div class="fg">
      <label class="fl">Email</label>
      <input type="email" id="a-email" class="fi" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="fg">
      <label class="fl">Password</label>
      <input type="password" id="a-pass" class="fi" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" id="a-btn" onclick="doAuth()">Log In</button>
    <div class="auth-err" id="a-err"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <div class="hdr">
    <div class="hdr-title" id="hdr-title">☕ Rankings</div>
    <div id="hdr-right"></div>
  </div>
  <div class="pane" id="pane"></div>
  <nav class="tabbar">
    <button class="tab on" id="t-rankings" onclick="go('rankings')">
      <span class="ico">🏆</span>Rankings
    </button>
    <button class="tab" id="t-add" onclick="go('add')">
      <span class="ico">➕</span>Add
    </button>
    <button class="tab" id="t-profile" onclick="go('profile')">
      <span class="ico">👤</span>Me
    </button>
  </nav>
</div>

<script type="module">
// ============================================================
//  FIREBASE CONFIG — paste yours here
// ============================================================
const firebaseConfig = {
  apiKey:            "AIzaSyD8H1a7muv0fA63opIn7mOFM4EpHp9jrRM",
  authDomain:        "cold-brew-connoisseurs.firebaseapp.com",
  projectId:         "cold-brew-connoisseurs",
  storageBucket:     "cold-brew-connoisseurs.firebasestorage.app",
  messagingSenderId: "426043876928",
  appId:             "1:426043876928:web:ad6b8aba407136f353a1a5"
};
// ============================================================

if (firebaseConfig.apiKey === "YOUR_API_KEY") {
  document.getElementById('setup-banner').style.display = 'flex';
} else {
  startApp();
}

async function startApp() {
  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js');
  const {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
    onAuthStateChanged, signOut, updateProfile
  } = await import('https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js');
  const {
    getFirestore, collection, addDoc, query, orderBy,
    onSnapshot, serverTimestamp, doc, deleteDoc
  } = await import('https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js');
  const {
    getStorage, ref, uploadBytes, getDownloadURL
  } = await import('https://www.gstatic.com/firebasejs/10.13.2/firebase-storage.js');

  const fapp    = initializeApp(firebaseConfig);
  const auth    = getAuth(fapp);
  const db      = getFirestore(fapp);
  const storage = getStorage(fapp);

  // ── State ──────────────────────────────────────────
  let me         = null;
  let tab        = 'rankings';
  let ratings    = [];
  let unsub      = null;
  let selPhoto   = null;

  // ── Utils ──────────────────────────────────────────
  const scoreColor = s => s >= 8 ? 'var(--green)' : s >= 6 ? 'var(--amber)' : 'var(--red)';
  const initials   = n => n ? n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2) : '?';
  const fmtLoc     = r => [r.city, r.state, r.country].filter(Boolean).join(', ') || '';
  const brewKey    = r => (r.storeName||'').toLowerCase().trim()+'|'+(r.city||'').toLowerCase().trim();
  const timeAgo    = ts => {
    if (!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    const s = Math.floor((Date.now()-d)/1000);
    if (s<60) return 'just now';
    if (s<3600) return Math.floor(s/60)+'m ago';
    if (s<86400) return Math.floor(s/3600)+'h ago';
    if (s<604800) return Math.floor(s/86400)+'d ago';
    return d.toLocaleDateString();
  };

  window.toast = msg => {
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 2400);
  };

  function groupByBrew(rs) {
    const map = {};
    for (const r of rs) {
      const k = brewKey(r);
      if (!map[k]) map[k] = { storeName:r.storeName, city:r.city, state:r.state, country:r.country, ratings:[], cover:null };
      map[k].ratings.push(r);
      if (!map[k].cover && r.imageUrl) map[k].cover = r.imageUrl;
    }
    return Object.values(map).map(b => ({
      ...b,
      avg: b.ratings.reduce((s,r)=>s+r.score,0)/b.ratings.length,
      cnt: b.ratings.length,
    })).sort((a,b)=>b.avg-a.avg);
  }

  // ── Auth globals (onclick attrs need these) ─────────
  window.setMode = mode => {
    const reg = mode==='register';
    document.getElementById('fg-name').style.display = reg?'block':'none';
    document.getElementById('a-btn').textContent = reg?'Create Account':'Log In';
    document.getElementById('a-pass').autocomplete = reg?'new-password':'current-password';
    document.getElementById('tab-login').classList.toggle('on',!reg);
    document.getElementById('tab-register').classList.toggle('on',reg);
    document.getElementById('a-err').textContent='';
  };

  window.doAuth = async () => {
    const email = document.getElementById('a-email').value.trim();
    const pass  = document.getElementById('a-pass').value;
    const name  = document.getElementById('a-name').value.trim();
    const reg   = document.getElementById('tab-register').classList.contains('on');
    const btn   = document.getElementById('a-btn');
    const err   = document.getElementById('a-err');
    err.textContent=''; btn.disabled=true;
    try {
      if (reg) {
        if (!name) { err.textContent='Please enter your name'; btn.disabled=false; return; }
        const c = await createUserWithEmailAndPassword(auth, email, pass);
        await updateProfile(c.user, {displayName: name});
      } else {
        await signInWithEmailAndPassword(auth, email, pass);
      }
    } catch(e) {
      const msgs = {
        'auth/email-already-in-use':'Email already registered',
        'auth/invalid-email':'Invalid email address',
        'auth/weak-password':'Password must be 6+ characters',
        'auth/user-not-found':'No account with that email',
        'auth/wrong-password':'Incorrect password',
        'auth/invalid-credential':'Invalid email or password',
      };
      err.textContent = msgs[e.code]||'Something went wrong. Try again.';
      btn.disabled=false;
    }
  };

  onAuthStateChanged(auth, user => {
    me = user;
    if (user) {
      document.getElementById('auth').style.display = 'none';
      document.getElementById('app').classList.add('on');
      if (!unsub) {
        const q = query(collection(db,'ratings'), orderBy('createdAt','desc'));
        unsub = onSnapshot(q, snap => {
          ratings = snap.docs.map(d=>({id:d.id,...d.data()}));
          render();
        });
      }
      go('rankings');
    } else {
      document.getElementById('auth').style.display = 'flex';
      document.getElementById('app').classList.remove('on');
      if (unsub) { unsub(); unsub=null; }
    }
  });

  // ── Tab navigation ──────────────────────────────────
  window.go = t => {
    tab = t;
    ['rankings','add','profile'].forEach(x=>{
      document.getElementById(`t-${x}`).classList.toggle('on',x===t);
    });
    render();
  };

  function render() {
    if (tab==='rankings') renderRankings();
    else if (tab==='add') renderAdd();
    else renderProfile();
  }

  // ── Rankings ────────────────────────────────────────
  function renderRankings() {
    document.getElementById('hdr-title').textContent='☕ Rankings';
    document.getElementById('hdr-right').innerHTML='';
    const brews = groupByBrew(ratings);
    const medals = ['🥇','🥈','🥉'];
    const pane = document.getElementById('pane');

    if (!brews.length) {
      pane.innerHTML=`<div class="empty"><div class="eico">☕</div><div class="etxt">No cold brews ranked yet</div><div class="esub">Be the first to add one!</div></div>`;
      return;
    }

    pane.innerHTML = `
      <div class="sec-hd">${brews.length} Cold Brew${brews.length!==1?'s':''} Ranked</div>
      ${brews.map((b,i)=>`
        <div class="brew-row" data-idx="${i}">
          ${i<3 ? `<div class="rank-medal">${medals[i]}</div>` : `<div class="rank-num">#${i+1}</div>`}
          <div class="brew-thumb">${b.cover?`<img src="${b.cover}" loading="lazy">`:'☕'}</div>
          <div class="brew-info">
            <div class="brew-name">${esc(b.storeName)}</div>
            <div class="brew-loc">${esc(fmtLoc(b))}</div>
            <div class="brew-meta">${b.cnt} rating${b.cnt!==1?'s':''}</div>
          </div>
          <div class="score-big" style="color:${scoreColor(b.avg)}">${b.avg.toFixed(1)}</div>
        </div>
      `).join('')}
      <div style="height:20px"></div>
    `;

    pane.querySelectorAll('.brew-row').forEach(row=>{
      row.addEventListener('click', ()=>openDetail(+row.dataset.idx));
    });
  }

  function openDetail(idx) {
    const brew = groupByBrew(ratings)[idx];
    if (!brew) return;
    const topPhoto = brew.cover;
    const ov = document.createElement('div');
    ov.className='overlay';
    ov.innerHTML=`
      <div class="sheet">
        <div class="handle"></div>
        ${topPhoto?`<img src="${topPhoto}" class="det-cover" alt="cover">`:''}
        <div class="det-top">
          <div class="det-name">${esc(brew.storeName)}</div>
          <div class="det-loc">${esc(fmtLoc(brew))}</div>
          <div style="display:flex;align-items:baseline">
            <div class="det-avg" style="color:${scoreColor(brew.avg)}">${brew.avg.toFixed(1)}</div>
            <div class="det-cnt">avg · ${brew.cnt} rating${brew.cnt!==1?'s':''}</div>
          </div>
        </div>
        <div class="sec-hd">All Ratings</div>
        ${brew.ratings.map(r=>`
          <div class="rater-row">
            <div class="mini-av">${initials(r.userName)}</div>
            <div class="rater-info">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <div class="rater-name">${esc(r.userName)}</div>
                <div class="rater-score" style="color:${scoreColor(r.score)}">${r.score.toFixed(1)}</div>
              </div>
              ${r.notes?`<div class="rater-notes">${esc(r.notes)}</div>`:''}
              ${r.imageUrl?`<img src="${r.imageUrl}" class="rater-img" loading="lazy">`:''}
              <div class="rater-date">${timeAgo(r.createdAt)}</div>
            </div>
          </div>
        `).join('')}
        <div style="height:20px"></div>
      </div>
    `;
    ov.addEventListener('click', e=>{ if(e.target===ov) ov.remove(); });
    document.body.appendChild(ov);
  }

  // ── Add form ─────────────────────────────────────────
  function renderAdd() {
    document.getElementById('hdr-title').textContent='➕ Add Rating';
    document.getElementById('hdr-right').innerHTML='';
    selPhoto = null;
    const stores = [...new Set(ratings.map(r=>r.storeName))].sort();

    document.getElementById('pane').innerHTML=`
      <div class="add-wrap">
        <datalist id="dl-stores">${stores.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
        <div class="fg">
          <label class="fl">Store Name *</label>
          <input type="text" id="f-store" class="fi" placeholder="e.g. Blue Bottle Coffee" list="dl-stores" autocomplete="off">
        </div>
        <div class="row2">
          <div class="fg">
            <label class="fl">City</label>
            <input type="text" id="f-city" class="fi" placeholder="New York">
          </div>
          <div class="fg">
            <label class="fl">State</label>
            <input type="text" id="f-state" class="fi" placeholder="NY">
          </div>
        </div>
        <div class="fg">
          <label class="fl">Country</label>
          <input type="text" id="f-country" class="fi" placeholder="USA">
        </div>
        <div class="fg">
          <label class="fl">Your Score</label>
          <div class="score-val" id="sv" style="color:${scoreColor(7.5)}">7.5</div>
          <input type="range" id="f-score" class="slider" min="1" max="10" step="0.1" value="7.5">
          <div class="slider-lbl"><span>1 — Bad</span><span>5.5</span><span>10 — 🔥</span></div>
        </div>
        <div class="fg">
          <label class="fl">Tasting Notes</label>
          <textarea id="f-notes" class="fi fi-ta" placeholder="Smooth, strong, sweet, chocolatey…"></textarea>
        </div>
        <div class="fg">
          <label class="fl">Photo (optional)</label>
          <button class="photo-zone" id="pz" onclick="document.getElementById('ph-in').click()">📷 Add a Photo</button>
          <input type="file" id="ph-in" accept="image/*" capture="environment" style="display:none">
          <img id="ph-prev" class="photo-prev" alt="preview">
        </div>
        <button class="btn" id="sub-btn" onclick="submitRating()">Submit Rating</button>
      </div>
    `;

    document.getElementById('f-score').addEventListener('input', function() {
      const v=parseFloat(this.value);
      const el=document.getElementById('sv');
      el.textContent=v.toFixed(1);
      el.style.color=scoreColor(v);
    });

    document.getElementById('ph-in').addEventListener('change', function() {
      const f=this.files[0]; if(!f) return;
      selPhoto=f;
      const prev=document.getElementById('ph-prev');
      prev.src=URL.createObjectURL(f); prev.style.display='block';
      const pz=document.getElementById('pz');
      pz.classList.add('filled'); pz.textContent='✅ Photo selected';
    });
  }

  window.submitRating = async () => {
    const store = document.getElementById('f-store').value.trim();
    if (!store) { toast('Store name is required'); return; }
    const btn=document.getElementById('sub-btn');
    btn.disabled=true; btn.textContent='Submitting…';
    try {
      let imageUrl=null;
      if (selPhoto) {
        try {
          const sref=ref(storage,`ratings/${me.uid}/${Date.now()}_${selPhoto.name}`);
          const snap=await uploadBytes(sref,selPhoto);
          imageUrl=await getDownloadURL(snap.ref);
        } catch(e) { toast('Photo upload failed — saving without it'); }
      }
      await addDoc(collection(db,'ratings'),{
        userId:    me.uid,
        userName:  me.displayName||me.email,
        storeName: store,
        city:      document.getElementById('f-city').value.trim(),
        state:     document.getElementById('f-state').value.trim(),
        country:   document.getElementById('f-country').value.trim(),
        score:     parseFloat(document.getElementById('f-score').value),
        notes:     document.getElementById('f-notes').value.trim(),
        imageUrl,
        createdAt: serverTimestamp(),
      });
      toast('Rating submitted! ☕');
      go('rankings');
    } catch(e) {
      toast('Error: '+e.message);
      btn.disabled=false; btn.textContent='Submit Rating';
    }
  };

  // ── Profile ──────────────────────────────────────────
  function renderProfile() {
    document.getElementById('hdr-title').textContent='👤 My Profile';
    document.getElementById('hdr-right').innerHTML='';
    const mine = ratings.filter(r=>r.userId===me.uid)
                        .sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    const avg  = mine.length ? mine.reduce((s,r)=>s+r.score,0)/mine.length : 0;
    const best = mine.length ? Math.max(...mine.map(r=>r.score)) : null;
    const name = me.displayName||me.email;

    document.getElementById('pane').innerHTML=`
      <div class="prof-hd">
        <div class="avatar">${initials(name)}</div>
        <div class="prof-name">${esc(name)}</div>
        <div class="prof-email">${esc(me.email)}</div>
      </div>
      <div class="stats">
        <div class="stat"><div class="stat-val">${mine.length}</div><div class="stat-lbl">Ratings</div></div>
        <div class="stat"><div class="stat-val">${avg?avg.toFixed(1):'—'}</div><div class="stat-lbl">Avg Given</div></div>
        <div class="stat"><div class="stat-val">${best!==null?best.toFixed(1):'—'}</div><div class="stat-lbl">Best</div></div>
      </div>
      ${mine.length ? `
        <div class="sec-hd">My Ratings</div>
        ${mine.map(r=>`
          <div class="my-row">
            <div class="my-row-top">
              <div>
                <div class="my-store">${esc(r.storeName)}</div>
                <div class="my-loc">${esc(fmtLoc(r))}</div>
              </div>
              <div style="display:flex;align-items:center;gap:8px">
                <div class="score-big" style="color:${scoreColor(r.score)}">${r.score.toFixed(1)}</div>
                <button class="del-btn" data-id="${r.id}" title="Delete">🗑</button>
              </div>
            </div>
            ${r.notes?`<div class="my-notes">${esc(r.notes)}</div>`:''}
            ${r.imageUrl?`<img src="${r.imageUrl}" class="my-img" loading="lazy">`:''}
            <div class="my-date">${timeAgo(r.createdAt)}</div>
          </div>
        `).join('')}
      ` : `
        <div class="empty"><div class="eico">📝</div><div class="etxt">No ratings yet</div><div class="esub">Go try some cold brew!</div></div>
      `}
      <button class="btn btn-ghost" style="width:calc(100% - 36px);margin:20px 18px 8px" onclick="doSignOut()">Sign Out</button>
      <div style="height:20px"></div>
    `;

    document.getElementById('pane').querySelectorAll('.del-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        if (!confirm('Delete this rating?')) return;
        try {
          await deleteDoc(doc(db,'ratings',btn.dataset.id));
          toast('Deleted');
        } catch(e) { toast('Error deleting'); }
      });
    });
  }

  window.doSignOut = () => signOut(auth);

  // ── XSS helper ──────────────────────────────────────
  function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
}
</script>
</body>
</html>
